apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

project.ext.set("hermesEnabled", true)

react {
    autolinkLibrariesWithApp()
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.goairm.intervity"
    defaultConfig {
        applicationId "com.goairm.intervity"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a", "x86_64" // 64-bit architecture required for GGUF models
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

task downloadSherpaOnnx {
    def aarFile = file("libs/sherpa-onnx.aar")
    outputs.file(aarFile)
    doLast {
        if (!aarFile.exists()) {
            aarFile.parentFile.mkdirs()
            println "Downloading sherpa-onnx-1.13.8.aar..."
            def url = new URI("https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar").toURL()
            url.openStream().withCloseable { inStream ->
                aarFile.withOutputStream { outStream ->
                    outStream << inStream
                }
            }
            println "sherpa-onnx-1.13.8.aar downloaded successfully."
        }
    }
}

tasks.matching { it.name.startsWith("preBuild") }.configureEach {
    dependsOn downloadSherpaOnnx
}

dependencies {
    implementation(files("libs/sherpa-onnx.aar"))
    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core-ktx:1.13.1")
}
